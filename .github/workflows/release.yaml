---
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: OrbitalTools
            asset_name: OrbitalTools-linux-x86_64
            build_cmd: >-
              PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
              zig build -Doptimize=ReleaseFast -Dcpu=baseline
              --search-prefix /usr
              --search-prefix /usr/lib/x86_64-linux-gnu

          - os: windows-latest
            artifact_name: OrbitalTools.exe
            asset_name: OrbitalTools-windows-x86_64.exe
            build_cmd: zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseFast

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            libwayland-bin
          # Symlink multiarch libs to /usr/lib so Zig can find them
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libGL.so /usr/lib/libGL.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libX11.so /usr/lib/libX11.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libXrandr.so /usr/lib/libXrandr.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libXinerama.so /usr/lib/libXinerama.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libXi.so /usr/lib/libXi.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libXcursor.so /usr/lib/libXcursor.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libwayland-client.so /usr/lib/libwayland-client.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libwayland-cursor.so /usr/lib/libwayland-cursor.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libwayland-egl.so /usr/lib/libwayland-egl.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libxkbcommon.so /usr/lib/libxkbcommon.so

      - name: Build
        run: ${{ matrix.build_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: zig-out/bin/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
